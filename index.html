<!DOCTYPE html>
<html>
<head>
    <title>MLM Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('treePage')">Tree</button>
    <button onclick="showPage('members')">Members</button>
    <button onclick="showPage('addMember')">+ Add Member</button>

    <hr>

    <button onclick="renameCompany()">Rename Company</button>

    <div id="companyList"></div>
</div>

<!-- ===== MAIN ===== -->
<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
        <h2>Dashboard</h2>
        <p>Total Members: <span id="totalMembers">0</span></p>
        <p>Total Pairs: <span id="totalPairs">0</span></p>
        <p>Total Income: ₹<span id="totalIncome">0</span></p>
        <p>Company Profit: ₹<span id="companyProfit">0</span></p>
    </div>

    <!-- TREE -->
    <div id="treePage" class="page">
        <h2>Binary Tree</h2>

        <div class="zoom-controls">
            <button onclick="zoomIn()">➕ Zoom</button>
            <button onclick="zoomOut()">➖ Zoom</button>
        </div>

        <div id="treeWrapper">
            <div id="treeContainer">
                <div id="tree" class="tree"></div>
            </div>
        </div>
    </div>

    <!-- MEMBERS -->
    <div id="members" class="page">
        <h2>Members</h2>

        <input type="text" id="search" placeholder="Search name or ID..." onkeyup="searchMember()">

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Left</th>
                    <th>Right</th>
                    <th>Pairs</th>
                    <th>Income</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="memberTable"></tbody>
        </table>
    </div>

    <!-- ADD MEMBER -->
    <div id="addMember" class="page">
        <h2>Add Member</h2>

        <input type="text" id="name" placeholder="Enter Name"><br><br>
        <input type="number" id="parentId" placeholder="Parent ID"><br><br>

        <button onclick="addMember('left')">Add Left</button>
        <button onclick="addMember('right')">Add Right</button>
    </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
