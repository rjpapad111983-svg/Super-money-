<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1e2d;
    color: white;
}

.sidebar {
    width: 200px;
    position: fixed;
    height: 100%;
    background: #081421;
    padding: 10px;
}

.sidebar button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    background: #ccc;
    border: none;
    cursor: pointer;
}

.main {
    margin-left: 210px;
    padding: 15px;
}

#tree {
    overflow: auto;
    white-space: nowrap;
}

.node {
    display: inline-block;
    border: 1px solid white;
    padding: 10px;
    margin: 10px;
    text-align: center;
    min-width: 120px;
}

button {
    margin: 2px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>MLM Panel</h3>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
</div>

<div class="main">

<!-- Dashboard -->
<div id="dashboardPage">
    <h2>Dashboard</h2>
    <p>Total Members: <span id="totalMembers"></span></p>
    <p>Total Pairs: <span id="totalPairs"></span></p>
    <p>Total Income: ₹<span id="totalIncome"></span></p>
    <p>Company Profit: ₹<span id="companyProfit"></span></p>
</div>

<!-- Tree -->
<div id="treePage" style="display:none;">
    <h2>Binary Tree</h2>
    <div id="tree"></div>
</div>

<!-- Members -->
<div id="membersPage" style="display:none;">
    <h2>Members</h2>

    <h3>Company Profit: ₹<span id="membersCompanyProfit"></span></h3>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Left</th>
                <th>Right</th>
                <th>Pairs</th>
                <th>Income</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody id="membersTable"></tbody>
    </table>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
