<!DOCTYPE html>
<html>
<head>
  <title>MLM Multi Company Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" style="padding:20px;">
  <h2>Admin Login</h2>
  <input id="adminUser" placeholder="Username"><br><br>
  <input id="adminPass" type="password" placeholder="Password"><br><br>
  <button onclick="adminLogin()">Login</button>
</div>

<div id="app" style="display:none;">

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>MLM Panel</h2>

    <!-- COMPANY SELECT -->
    <select id="companySelect" onchange="changeCompany()">
      <option value="1">Company 1</option>
      <option value="2">Company 2</option>
      <option value="3">Company 3</option>
      <option value="4">Company 4</option>
      <option value="5">Company 5</option>
      <option value="6">Company 6</option>
      <option value="7">Company 7</option>
      <option value="8">Company 8</option>
      <option value="9">Company 9</option>
      <option value="10">Company 10</option>
    </select>

    <br><br>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Dashboard -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="members"></span></p>
      <p>Total Pairs: <span id="pairs"></span></p>
      <p>Commission: ₹<span id="commission"></span></p>
      <p>Company Profit: ₹<span id="profit"></span></p>
    </div>

    <!-- Tree -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>
      <button onclick="addMemberToNode(1,'left')">Add Left</button>
      <button onclick="addMemberToNode(1,'right')">Add Right</button>
      <div id="tree"></div>
    </div>

    <!-- Members -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <input type="text" id="searchBox" placeholder="🔍 Search..." onkeyup="searchMember()">

      <table border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Wallet</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>

      <!-- Action -->
      <div id="actionBox" style="display:none; background:#111; padding:15px; margin-top:15px;">
        <h3>Withdraw / Transfer</h3>

        <h4>Withdraw</h4>
        <input id="w_amount" placeholder="Amount"><br>
        <button onclick="submitWithdraw()">Submit</button>

        <hr>

        <h4>Transfer</h4>
        <input id="t_to" placeholder="Receiver Name"><br>
        <input id="t_amount" placeholder="Amount"><br>
        <button onclick="submitTransfer()">Send</button>

        <br><br>
        <button onclick="closeAction()">Close</button>
      </div>

    </div>

  </div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
