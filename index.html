<!DOCTYPE html>
<html>
<head>
  <title>MLM Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display:flex; font-family:sans-serif;">

  <!-- SIDEBAR -->
  <div style="width:220px; background:#0d1117; color:white; height:100vh; padding:15px;">
    <h2>MLM Pro</h2>

    <button onclick="showPage('dashboard')">Dashboard</button><br><br>
    <button onclick="showPage('tree')">Binary Tree</button><br><br>
    <button onclick="showPage('members')">Members</button>
  </div>

  <!-- CONTENT -->
  <div style="flex:1; padding:20px; background:#020617; color:white; min-height:100vh;">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>

      <p>Total Members: <span id="members"></span></p>
      <p>Total Pairs: <span id="pairs"></span></p>
      <p>Total Commission: ₹<span id="commission"></span></p>
      <p>Company Profit: ₹<span id="profit"></span></p>
    </div>

    <!-- TREE -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>

      <button onclick="addMember('left')">Add Left</button>
      <button onclick="addMember('right')">Add Right</button>

      <div id="tree"></div>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h2>Members Directory</h2>

      <table border="1" width="100%" style="color:white;">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
