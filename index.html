<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Dashboard -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>

      <p>Total Members: <span id="members"></span></p>
      <p>Total Pairs: <span id="pairs"></span></p>
      <p>Commission: ₹<span id="commission"></span></p>
      <p>Company Profit: ₹<span id="profit"></span></p>
    </div>

    <!-- Tree -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>

      <button onclick="addMemberToNode(1,'left')">Add Left</button>
      <button onclick="addMemberToNode(1,'right')">Add Right</button>

      <div id="tree"></div>
    </div>

    <!-- Members -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <!-- 🔍 SEARCH -->
      <input 
        type="text" 
        id="searchBox" 
        placeholder="🔍 Search name..." 
        onkeyup="searchMember()" 
        style="padding:8px; margin-bottom:10px; width:220px;"
      >

      <!-- RESULT BOX -->
      <div id="searchResult"></div>

      <!-- TABLE -->
      <table border="1" cellpadding="5">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
