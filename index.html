<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLM Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#0b1a2f; color:white; }

.sidebar {
  width:200px; height:100vh; background:#081225; position:fixed;
}
.sidebar h2 { text-align:center; padding:20px; }
.sidebar button {
  width:100%; padding:10px; background:#12284a; border:none; color:white; margin-bottom:5px;
}

.main { margin-left:200px; padding:20px; }

input, button, select { padding:8px; margin:5px; }

table { width:100%; border-collapse:collapse; }
th, td { border:1px solid #2a3f5f; padding:8px; text-align:center; }

.tree-box {
  border:1px solid white;
  padding:10px;
  margin:10px;
  display:inline-block;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>MLM Panel</h2>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('tree')">Tree</button>
  <button onclick="showPage('members')">Members</button>
</div>

<div class="main">

<h3>Select Company</h3>

<select id="companySelect" onchange="changeCompany()">
  <option value="1">Company 1</option>
  <option value="2">Company 2</option>
</select>

<br><br>

<input type="text" id="companyNameInput" placeholder="Enter company name">
<button onclick="renameCompany()">Rename Company</button>

<hr>

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Dashboard</h2>
  <p>Total Members: <span id="totalMembers">0</span></p>
  <p>Total Pairs: <span id="totalPairs">0</span></p>
  <p>Commission: ₹<span id="totalCommission">0</span></p>
</div>

<!-- TREE -->
<div id="tree" style="display:none;">
  <h2>Binary Tree</h2>
  <div id="treeContainer"></div>
</div>

<!-- MEMBERS -->
<div id="members" style="display:none;">
  <h2>Members</h2>

  <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchMember()">

  <h3>Add Member</h3>

  <input type="text" id="name" placeholder="Name">
  <input type="number" id="memberId" placeholder="ID">

  <button onclick="addMember()">Join</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Left</th>
        <th>Right</th>
        <th>Income</th>
      </tr>
    </thead>
    <tbody id="memberTable"></tbody>
  </table>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
