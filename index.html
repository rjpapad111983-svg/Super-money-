<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>MLM Panel</h2>

  <button onclick="showPage('dashboardPage')">Dashboard</button>
  <button onclick="showPage('treePage')">Tree</button>
  <button onclick="showPage('membersPage')">Members</button>
  <button onclick="addMember(1,'left')">+ Add Member</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboardPage">
    <h2>Dashboard</h2>
    <p>Total Members: <span id="totalMembers">0</span></p>
    <p>Total Pairs: <span id="totalPairs">0</span></p>
    <p>Total Income: ₹<span id="totalIncome">0</span></p>
    <p>Company Profit: ₹<span id="companyProfit">0</span></p>
  </div>

  <!-- TREE -->
  <div id="treePage" style="display:none">
    <h2>Binary Tree</h2>
    <div id="tree"></div>
  </div>

  <!-- MEMBERS -->
  <div id="membersPage" style="display:none">
    <h2>Members</h2>
<input type="text" id="searchInput" placeholder="Search name / ID..." onkeyup="searchMember()" style="margin-bottom:10px; padding:5px; width:200px;">
  <input type="text" id="teamSearch" placeholder="Enter name for team" style="margin-left:10px;">
<button onclick="showTeam()">Show Team</button> 
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Left</th>
          <th>Right</th>
          <th>Pairs</th>
          <th>Income</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="membersTable"></tbody>
    </table>

  </div>

</div>

<!-- FIX SCRIPT -->
<script>
function showPage(pageId) {
  document.getElementById("dashboardPage").style.display = "none";
  document.getElementById("treePage").style.display = "none";
  document.getElementById("membersPage").style.display = "none";

  document.getElementById(pageId).style.display = "block";
}

// dummy function (error avoid)
function addMember(id, side) {
  alert("Add Member Clicked");
}
</script>

<!-- ORIGINAL SCRIPT -->
<script src="script.js" defer></script>

</body>
</html>
