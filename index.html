<!DOCTYPE html>
<html>
<head>
  <title>MLM Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>MLM Pro</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Binary Tree</button>
    <button onclick="showPage('members')">Members</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h1>Dashboard</h1>

      <div class="cards">
        <div class="card">
          <h3>Total Members</h3>
          <p id="members">0</p>
        </div>

        <div class="card">
          <h3>Total Pairs</h3>
          <p id="pairs">0</p>
        </div>

        <div class="card">
          <h3>Total Commission</h3>
          <p>₹<span id="commission">0</span></p>
        </div>

        <div class="card">
          <h3>Company Profit</h3>
          <p>₹<span id="profit">0</span></p>
        </div>
      </div>
    </div>

    <!-- TREE -->
    <div id="treePage" style="display:none;">
      <h1>Binary Tree</h1>

      <button onclick="addMember('left')">Add Left</button>
      <button onclick="addMember('right')">Add Right</button>

      <div id="tree"></div>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h1>Members Directory</h1>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
