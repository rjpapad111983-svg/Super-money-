<!DOCTYPE html>
<html>
<head>
  <title>MLM System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h1>Dashboard</h1>

      <p>Total Members: <span id="members">0</span></p>
      <p>Total Pairs: <span id="pairs">0</span></p>
      <p>Commission: ₹<span id="commission">0</span></p>
      <p>Company Profit: ₹<span id="profit">0</span></p>
    </div>

    <!-- TREE -->
    <div id="treePage" style="display:none;">
      <h1>Binary Tree</h1>

      <button onclick="addMemberToNode(1,'left')">Add Left</button>
      <button onclick="addMemberToNode(1,'right')">Add Right</button>

      <div id="tree"></div>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h1>Members</h1>

      <table border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
