<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    background: #022c33;
    color: white;
}

/* SIDEBAR */
.sidebar {
    width: 200px;
    background: #011f24;
    padding: 10px;
}

.sidebar h2 {
    text-align: center;
}

.sidebar button {
    width: 100%;
    margin: 5px 0;
    padding: 10px;
    background: #0a4c57;
    border: none;
    color: white;
    border-radius: 5px;
}

/* MAIN */
.main {
    flex: 1;
    padding: 15px;
}

/* PAGE */
.page {
    display: none;
}

.page.active {
    display: block;
}

/* TREE */
.tree ul {
    padding-top: 20px;
    position: relative;
    display: flex;
    justify-content: center;
}

.tree li {
    list-style: none;
    text-align: center;
    margin: 0 20px;
}

.tree-box {
    border: 1px solid white;
    padding: 10px;
    border-radius: 8px;
    background: #033f47;
}

.tree-box button {
    margin: 3px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #0a4c57;
    padding: 8px;
    text-align: center;
}

/* COMPANY BUTTONS */
#companyList button {
    margin: 3px;
    padding: 5px;
}
</style>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
    <button onclick="updateCompanyName()">Rename Company</button>

    <hr>

    <div id="companyList"></div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
        <h2>Dashboard</h2>
        Total Members: <span id="totalMembers"></span>
    </div>

    <!-- TREE -->
    <div id="tree" class="page">
        <h2>Binary Tree</h2>
        <div id="treeContainer"></div>
    </div>

    <!-- MEMBERS -->
    <div id="members" class="page">
        <h2>Members</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Left</th>
                    <th>Right</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="memberTable"></tbody>
        </table>
    </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>
// PAGE SWITCH
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });
    document.getElementById(pageId).classList.add("active");
}
</script>

</body>
</html>
