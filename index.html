<!DOCTYPE html>
<html>
<head>
  <title>MLM Binary System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Binary Tree System</h1>

<button onclick="addMember('left')">Add Left</button>
<button onclick="addMember('right')">Add Right</button>

<h3>Total Members: <span id="members">0</span></h3>
<h3>Total Pairs: <span id="pairs">0</span></h3>
<h3>Total Commission: ₹<span id="commission">0</span></h3>
<h3>Company Profit: ₹<span id="profit">0</span></h3>

<hr>

<div id="tree"></div>

<hr>

<h2>Members Directory</h2>

<table border="1" width="100%">
  <thead>
    <tr>
      <th>Name</th>
      <th>ID</th>
      <th>Left</th>
      <th>Right</th>
      <th>Income</th>
    </tr>
  </thead>
  <tbody id="membersTable"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
