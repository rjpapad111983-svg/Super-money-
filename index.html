<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
    <button onclick="updateCompanyName()">Rename Company</button>

    <hr>

    <!-- COMPANY LIST -->
    <div id="companyList"></div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
        <h2>Dashboard</h2>

        Total Members: <span id="totalMembers">0</span><br>
        Total Pairs: <span id="totalPairs">0</span><br>
        Total Income: <span id="totalIncome">₹0</span><br>
        Company Profit: <span id="companyProfit">₹0</span>
    </div>

    <!-- TREE -->
    <div id="tree" class="page">
        <h2>Binary Tree</h2>
        <div id="treeContainer"></div>
    </div>

    <!-- MEMBERS -->
    <div id="members" class="page">
        <h2>Members</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Left</th>
                    <th>Right</th>
                    <th>Pairs</th>   <!-- ADD -->
                    <th>Income</th>  <!-- ADD -->
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="memberTable">
                <!-- JS will fill -->
            </tbody>
        </table>
    </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>
// PAGE SWITCH
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });
    document.getElementById(pageId).classList.add("active");
}
</script>

</body>
</html>
