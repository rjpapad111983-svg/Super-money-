<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display:flex; height:100vh;">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>MLM Panel</h3>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>

    <!-- 🔥 NEW AUTO ADD -->
    <button onclick="addMemberAuto()">+ Add Member</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="totalMembers"></span></p>
      <p>Total Pairs: <span id="totalPairs"></span></p>
      <p>Total Income: <span id="totalIncome"></span></p>
      <p>Company Profit: <span id="companyProfit"></span></p>
    </div>

    <!-- TREE -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>

      <button onclick="zoomIn()">➕ Zoom</button>
      <button onclick="zoomOut()">➖ Zoom</button>

      <div id="treeWrapper">
        <div id="tree"></div>
      </div>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchMember()">

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Pairs</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
