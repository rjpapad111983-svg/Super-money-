<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display:flex; height:100vh;">

  <!-- LEFT MENU -->
  <div style="width:200px; background:#0b1e2d; padding:10px;">
    <h3 style="color:white;">MLM Panel</h3>

    <button onclick="showPage('dashboard')" style="width:100%; margin-bottom:10px;">Dashboard</button>
    <button onclick="showPage('tree')" style="width:100%; margin-bottom:10px;">Tree</button>
    <button onclick="showPage('members')" style="width:100%;">Members</button>
  </div>

  <!-- RIGHT CONTENT -->
  <div style="flex:1; padding:20px; color:white;">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="totalMembers"></span></p>
      <p>Total Pairs: <span id="totalPairs"></span></p>
      <p>Total Income: <span id="totalIncome"></span></p>
      <p>Company Profit: <span id="companyProfit"></span></p>
    </div>

    <!-- TREE -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>

      <!-- 🔥 ZOOM BUTTON -->
      <button onclick="zoomIn()">➕ Zoom</button>
      <button onclick="zoomOut()">➖ Zoom</button>

      <!-- 🔥 TREE WRAPPER -->
      <div id="treeWrapper">
        <div id="tree"></div>
      </div>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <!-- SEARCH -->
      <input type="text" id="searchInput" placeholder="Search name or ID..." onkeyup="searchMember()">

      <table border="1" width="100%" style="margin-top:10px;">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Pairs</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
