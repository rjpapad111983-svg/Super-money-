<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1e2d;
      color: white;
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 200px;
      background: #071521;
      padding: 20px;
      height: 100vh;
    }

    .sidebar button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      cursor: pointer;
    }

    .content {
      flex: 1;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: center;
    }

    input {
      padding: 8px;
      margin-bottom: 10px;
      width: 200px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h3>MLM Panel</h3>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('members')">Members</button>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="totalMembers"></span></p>
      <p>Total Pairs: <span id="totalPairs"></span></p>
      <p>Total Income: ₹<span id="totalIncome"></span></p>
      <p>Company Profit: ₹<span id="companyProfit"></span></p>
    </div>

    <!-- MEMBERS -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <input type="text" id="search" placeholder="Search..." onkeyup="searchMember()">

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Pairs</th>
            <th>Income</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
