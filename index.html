<!DOCTYPE html>
<html>
<head>
    <title>MLM Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>MLM Panel</h2>

    <button onclick="renderDashboard()">Dashboard</button>
    <button onclick="renderTree()">Tree</button>
    <button onclick="renderMembers()">Members</button>
    <button onclick="addMember(1,'L')">+ Add Member</button>
</div>

<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h2>Dashboard</h2>
        <p id="totalMembers"></p>
        <p id="totalPairs"></p>
        <p id="totalIncome"></p>
        <p id="companyProfit"></p>
    </div>

    <!-- TREE -->
    <div id="tree"></div>

    <!-- MEMBERS -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Left</th>
                <th>Right</th>
                <th>Pairs</th>
                <th>Income</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="membersTable"></tbody>
    </table>

</div>

<script src="script.js"></script>

</body>
</html>
