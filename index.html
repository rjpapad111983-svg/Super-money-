<!DOCTYPE html>
<html>
<head>
  <title>Binary Tree System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body style="background:#0b1320; color:white; text-align:center;">

  <h1>Binary Tree System</h1>

  <!-- 🔥 DASHBOARD ADD -->
  <div id="dashboard" style="margin-bottom:20px;">
    
    <h2>Dashboard</h2>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;">

      <div class="card">Members: <span id="members">0</span></div>
      <div class="card">Pairs: <span id="pairs">0</span></div>
      <div class="card">Commission: ₹<span id="commission">0</span></div>
      <div class="card">Company Profit: ₹<span id="profit">0</span></div>

    </div>

    <h3 style="margin-top:20px;">Top Earners</h3>
    <div id="topEarners"></div>

  </div>

  <!-- 🔥 EXISTING BUTTONS -->
  <button onclick="addMember('left')">Add Left</button>
  <button onclick="addMember('right')">Add Right</button>

  <!-- TREE -->
  <div id="tree"></div>

  <script src="script.js"></script>

</body>
</html>
