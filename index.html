<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLM Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1f2a;
  color: white;
}

.sidebar {
  width: 200px;
  height: 100vh;
  background: #061621;
  position: fixed;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  background: #ddd;
  border: none;
  cursor: pointer;
}

.main {
  margin-left: 220px;
  padding: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #555;
  padding: 8px;
  text-align: center;
}

.node {
  border: 1px solid white;
  padding: 10px;
  display: inline-block;
  margin: 10px;
}
</style>

</head>

<body>

<div class="sidebar">
  <h3>MLM Panel</h3>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('tree')">Tree</button>
  <button onclick="showPage('members')">Members</button>
</div>

<div class="main">

<div id="dashboardPage">
  <h2>Dashboard</h2>
  <p>Total Members: <span id="totalMembers"></span></p>
  <p>Total Pairs: <span id="totalPairs"></span></p>
  <p>Total Income: ₹<span id="totalIncome"></span></p>
  <p>Company Profit: ₹<span id="companyProfit"></span></p>
</div>

<div id="treePage" style="display:none;">
  <h2>Binary Tree</h2>
  <div id="tree"></div>
</div>

<div id="membersPage" style="display:none;">
  <h2>Members</h2>
  <table id="membersTable"></table>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
