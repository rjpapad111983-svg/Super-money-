<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>MLM Panel</h2>

        <button onclick="showPage('dashboard')">Dashboard</button>
        <button onclick="showPage('tree')">Tree</button>
        <button onclick="showPage('members')">Members</button>
        <button onclick="addRootMember()">+ Add Member</button>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Dashboard -->
        <div id="dashboard" class="page">
            <h2>Dashboard</h2>
            <p>Total Members: <span id="totalMembers">0</span></p>
            <p>Total Pairs: <span id="totalPairs">0</span></p>
            <p>Total Income: ₹<span id="totalIncome">0</span></p>
            <p>Company Profit: ₹<span id="companyProfit">0</span></p>
        </div>

        <!-- Tree -->
        <div id="tree" class="page" style="display:none;">
            <h2>Binary Tree</h2>
            <div id="treeContainer" class="tree-container"></div>
        </div>

        <!-- Members -->
        <div id="members" class="page" style="display:none;">
            <h2>Members</h2>

            <input type="text" id="search" placeholder="Search name or ID..." onkeyup="searchMember()">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>ID</th>
                        <th>Left</th>
                        <th>Right</th>
                        <th>Pairs</th>
                        <th>Income</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="membersTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>

<script>
// 👉 Page Switch
function showPage(page) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(page).style.display = "block";
}

// 👉 Add Root Member
function addRootMember() {
    let name = prompt("Enter Member Name:");
    if (!name) return;

    addMember(name, 1, "left"); // auto attach
}

// 👉 Search
function searchMember() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#membersTable tr");

    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
}
</script>

</body>
</html>
