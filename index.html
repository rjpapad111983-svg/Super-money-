<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLM Panel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <h2>MLM Panel</h2>

    <button class="btn-dashboard">Dashboard</button>
    <button class="btn-tree">Tree</button>
    <button class="btn-members">Members</button>
    <button class="btn-add">+ Add Member</button>

    <hr>

    <button>RJ Recharge</button>
    <button>Company 2</button>
    <button>Company 3</button>
    <button>Company 4</button>
    <button>Company 5</button>
    <button>Company 6</button>
    <button>Company 7</button>
    <button>Company 8</button>
    <button>Company 9</button>
    <button>Company 10</button>
  </div>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard">
      <h2>Dashboard</h2>

      <p>Total Members: <span id="totalMembers">0</span></p>
      <p>Total Pairs: <span id="totalPairs">0</span></p>
      <p>Total Income: <span id="totalIncome">₹0</span></p>
      <p>Company Profit: <span id="companyProfit">₹0</span></p>
    </div>

    <!-- ===== TREE ===== -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>
      <div id="tree"></div>
    </div>

    <!-- ===== MEMBERS ===== -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Pairs</th>
            <th>Income</th>
          </tr>
        </thead>

        <tbody id="memberTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
