<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h2>MLM Panel</h2>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tree')">Tree</button>
    <button onclick="showPage('members')">Members</button>
  </div>

  <div class="main">

    <!-- Dashboard -->
    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="members"></span></p>
      <p>Total Pairs: <span id="pairs"></span></p>
      <p>Commission: ₹<span id="commission"></span></p>
      <p>Company Profit: ₹<span id="profit"></span></p>
    </div>

    <!-- Tree -->
    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>
      <button onclick="addMemberToNode(1,'left')">Add Left</button>
      <button onclick="addMemberToNode(1,'right')">Add Right</button>
      <div id="tree"></div>
    </div>

    <!-- Members -->
    <div id="membersPage" style="display:none;">
      <h2>Members</h2>

      <input type="text" id="searchBox" placeholder="🔍 Search..." onkeyup="searchMember()">

      <table border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Left</th>
            <th>Right</th>
            <th>Income</th>
            <th>Wallet</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="membersTable"></tbody>
      </table>

      <!-- Action Box -->
      <div id="actionBox" style="display:none; background:#111; padding:15px; margin-top:10px;">
        <h3>Withdraw / Transfer</h3>

        <h4>Bank Withdraw</h4>
        <input id="w_name" placeholder="Name"><br>
        <input id="w_account" placeholder="Account Number"><br>
        <input id="w_ifsc" placeholder="IFSC"><br>
        <input id="w_amount" placeholder="Amount"><br>
        <button onclick="submitWithdraw()">Submit Withdraw</button>

        <hr>

        <h4>Transfer</h4>
        <input id="t_to" placeholder="Receiver Name"><br>
        <input id="t_amount" placeholder="Amount"><br>
        <button onclick="submitTransfer()">Send</button>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
