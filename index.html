<!DOCTYPE html>
<html>
<head>
    <title>MLM Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>MLM Panel</h2>

<div class="menu">
    <button onclick="showTree()">Tree</button>
    <button onclick="showMembers()">Members</button>
</div>

<!-- ✅ TREE SECTION -->
<div id="treeSection">
    <h3>Binary Tree</h3>
    <div id="tree"></div>
</div>

<!-- ✅ MEMBERS SECTION -->
<div id="membersSection" style="display:none;">
    <h3>Members</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Left</th>
                <th>Right</th>
                <th>Pairs</th>
                <th>Income</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="membersTable"></tbody>
    </table>
</div>

<script src="script.js"></script>

</body>
</html>
