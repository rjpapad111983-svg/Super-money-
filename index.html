<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1d2a;
    color: white;
}

.sidebar {
    width: 200px;
    height: 100vh;
    background: #081622;
    position: fixed;
    padding: 20px;
}

.sidebar h2 {
    margin-bottom: 20px;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    background: #eee;
    color: black;
    cursor: pointer;
}

.main {
    margin-left: 220px;
    padding: 20px;
}

input {
    padding: 8px;
}

button {
    padding: 8px;
    margin: 5px;
}

/* TREE STYLE */
#tree {
    overflow-x: auto;
    white-space: nowrap;
}

.node {
    display: inline-block;
    border: 1px solid #fff;
    padding: 10px;
    margin: 10px;
    text-align: center;
}

.children {
    display: flex;
    justify-content: center;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>MLM Panel</h2>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('treePage')">Tree</button>
    <button onclick="showPage('membersPage')">Members</button>
</div>

<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h2>Dashboard</h2>
        <p>Total Members: <span id="totalMembers">0</span></p>
        <p>Total Pairs: <span id="totalPairs">0</span></p>
        <p>Total Income: <span id="totalIncome">₹0</span></p>
        <p>Company Profit: <span id="companyProfit">₹0</span></p>
    </div>

    <!-- TREE PAGE -->
    <div id="treePage" style="display:none;">
        <h2>Binary Tree</h2>
        <div id="tree"></div>
    </div>

    <!-- MEMBERS PAGE -->
    <div id="membersPage" style="display:none;">
        <h2>Members</h2>
        <p>Members list auto tree se manage hoga</p>
    </div>

</div>

<script>
// PAGE SWITCH
function showPage(page) {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("treePage").style.display = "none";
    document.getElementById("membersPage").style.display = "none";

    document.getElementById(page).style.display = "block";
}

// ===================== MLM SCRIPT =====================

let members = [];

// ROOT MEMBER
function initRoot() {
    if (members.length === 0) {
        members.push({
            id: 1,
            name: "Rajesh",
            parentId: null,
            left: null,
            right: null
        });
    }
}

// ADD MEMBER
function addMember(parentId, side) {
    let parent = members.find(m => m.id == parentId);

    if (!parent) return alert("Parent not found");
    if (parent[side]) return alert("Already filled");

    let id = members.length + 1;

    let newMember = {
        id,
        name: "Member " + id,
        parentId,
        left: null,
        right: null
    };

    members.push(newMember);
    parent[side] = id;

    updateAll();
}

// EDIT NAME
function editMember(id) {
    let m = members.find(x => x.id == id);
    let name = prompt("Enter Name", m.name);
    if (name) {
        m.name = name;
        updateAll();
    }
}

// DOWNLINE COUNT
function countDownline(id) {
    let m = members.find(x => x.id == id);
    if (!m) return 0;

    let c = 0;
    if (m.left) c += 1 + countDownline(m.left);
    if (m.right) c += 1 + countDownline(m.right);

    return c;
}

// PAIRS
function countPairs(id) {
    let m = members.find(x => x.id == id);
    if (!m) return 0;

    let l = m.left ? 1 + countDownline(m.left) : 0;
    let r = m.right ? 1 + countDownline(m.right) : 0;

    return Math.min(l, r);
}

// TOTAL
function totalPairs() {
    let t = 0;
    members.forEach(m => t += countPairs(m.id));
    return t;
}

function totalIncome() {
    return totalPairs() * 3;
}

function companyProfit() {
    return (members.length * 10) - totalIncome();
}

// TREE RENDER
function renderTree() {
    let container = document.getElementById("tree");
    container.innerHTML = "";

    function build(id) {
        let m = members.find(x => x.id == id);
        if (!m) return "";

        let pairs = countPairs(id);
        let income = pairs * 3;

        return `
        <div class="node">
            <div>${m.name}</div>
            <div>Pair: ${pairs}</div>
            <div>₹${income}</div>
            <button onclick="addMember(${id}, 'left')">L</button>
            <button onclick="addMember(${id}, 'right')">R</button>
            <button onclick="editMember(${id})">Edit</button>

            <div class="children">
                ${m.left ? build(m.left) : ""}
                ${m.right ? build(m.right) : ""}
            </div>
        </div>
        `;
    }

    container.innerHTML = build(1);
}

// DASHBOARD
function updateDashboard() {
    document.getElementById("totalMembers").innerText = members.length;
    document.getElementById("totalPairs").innerText = totalPairs();
    document.getElementById("totalIncome").innerText = "₹" + totalIncome();
    document.getElementById("companyProfit").innerText = "₹" + companyProfit();
}

// UPDATE
function updateAll() {
    renderTree();
    updateDashboard();
}

// INIT
initRoot();
updateAll();
</script>

</body>
</html>
