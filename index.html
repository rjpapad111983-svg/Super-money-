<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:#0b1b2b;
      color:white;
    }

    .sidebar {
      width:180px;
      height:100vh;
      background:#071423;
      float:left;
      padding:15px;
    }

    .sidebar button {
      width:100%;
      margin:5px 0;
      padding:8px;
    }

    .main {
      margin-left:200px;
      padding:15px;
    }

    @media(max-width:768px){
      .sidebar{width:100%;height:auto;}
      .main{margin-left:0;}
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }

    th,td {
      border:1px solid #555;
      padding:6px;
      text-align:center;
    }

    input,select {
      padding:6px;
      margin:5px;
    }

    /* TREE */
    #treeContainer {
      overflow-x:auto;
      padding:20px;
    }

    #treeContainer ul {
      padding-top:20px;
      position:relative;
      display:table;
      margin:auto;
    }

    #treeContainer li {
      display:table-cell;
      text-align:center;
      vertical-align:top;
      padding:20px 10px;
      position:relative;
    }

    #treeContainer li::before,
    #treeContainer li::after {
      content:'';
      position:absolute;
      top:0;
      right:50%;
      border-top:1px solid #fff;
      width:50%;
      height:20px;
    }

    #treeContainer li::after {
      right:auto;
      left:50%;
      border-left:1px solid #fff;
    }

    #treeContainer ul ul::before {
      content:'';
      position:absolute;
      top:0;
      left:50%;
      border-left:1px solid #fff;
      height:20px;
    }

    .node {
      border:1px solid #fff;
      padding:6px;
      border-radius:6px;
      font-size:11px;
      min-width:90px;
      display:inline-block;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h3>MLM Panel</h3>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('tree')">Tree</button>
  <button onclick="showPage('members')">Members</button>
</div>

<div class="main">

  <h4>Select Company</h4>
  <select id="companySelect">
    <option value="1">Company 1</option>
  </select>

  <h2 id="companyTitle">Company 1</h2>

  <input id="companyNameInput" placeholder="Enter company name">
  <button onclick="renameCompany()">Rename</button>

  <hr>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <h3>Dashboard</h3>
    <p>Total Members: <span id="totalMembers">0</span></p>
    <p>Total Pairs: <span id="totalPairs">0</span></p>
    <p>Total Income: ₹<span id="totalCommission">0</span></p>
    <p>Company Profit: ₹<span id="companyProfit">0</span></p>
  </div>

  <!-- TREE -->
  <div id="tree" style="display:none;">
    <h3>Binary Tree</h3>
    <div id="treeContainer"></div>
  </div>

  <!-- MEMBERS -->
  <div id="members" style="display:none;">
    <h3>Members</h3>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Left</th>
          <th>Right</th>
          <th>Pair</th>
          <th>Income</th>
          <th>Profit</th>
          <th>Edit</th>
        </tr>
      </thead>
      <tbody id="memberTable"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
