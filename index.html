<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b1d2a;
    color:white;
}
.sidebar {
    width:200px;
    height:100vh;
    background:#081622;
    position:fixed;
    padding:20px;
}
.sidebar button {
    width:100%;
    margin:10px 0;
    padding:10px;
    background:#eee;
    border:none;
}
.main {
    margin-left:220px;
    padding:20px;
}

/* TREE */
#tree {
    overflow-x:auto;
}
.node {
    border:1px solid white;
    padding:10px;
    margin:10px;
    text-align:center;
}
.children {
    display:flex;
    justify-content:center;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>MLM Panel</h2>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('treePage')">Tree</button>
</div>

<div class="main">

<div id="dashboard">
    <h2>Dashboard</h2>
    <p>Total Members: <span id="totalMembers">0</span></p>
    <p>Total Pairs: <span id="totalPairs">0</span></p>
    <p>Total Income: <span id="totalIncome">₹0</span></p>
    <p>Company Profit: <span id="companyProfit">₹0</span></p>
</div>

<div id="treePage" style="display:none;">
    <h2>Binary Tree</h2>
    <div id="tree"></div>
</div>

</div>

<script>

// 👉 PAGE SWITCH
function showPage(p){
    document.getElementById("dashboard").style.display="none";
    document.getElementById("treePage").style.display="none";
    document.getElementById(p).style.display="block";
}

// 👉 DATA
let members = [];

// 👉 INIT ROOT
function init(){
    members = [{
        id:1,
        name:"Rajesh",
        left:null,
        right:null
    }];
}

// 👉 ADD MEMBER
function addMember(parentId, side){
    let p = members.find(x=>x.id==parentId);

    if(p[side]) return alert("Already filled");

    let id = members.length+1;

    members.push({
        id,
        name:"Member "+id,
        left:null,
        right:null
    });

    p[side] = id;

    update();
}

// 👉 COUNT DOWNLINE
function downline(id){
    let m = members.find(x=>x.id==id);
    if(!m) return 0;

    let c=0;
    if(m.left) c+=1+downline(m.left);
    if(m.right) c+=1+downline(m.right);

    return c;
}

// 👉 PAIRS
function pairs(id){
    let m = members.find(x=>x.id==id);
    if(!m) return 0;

    let l = m.left ? 1+downline(m.left):0;
    let r = m.right ? 1+downline(m.right):0;

    return Math.min(l,r);
}

// 👉 TOTAL
function totalPairs(){
    return members.reduce((t,m)=>t+pairs(m.id),0);
}

function totalIncome(){
    return totalPairs()*3;
}

function profit(){
    return members.length*10 - totalIncome();
}

// 👉 TREE
function draw(){
    let box = document.getElementById("tree");

    function make(id){
        let m = members.find(x=>x.id==id);
        if(!m) return "";

        return `
        <div class="node">
            <div>${m.name}</div>
            <div>Pair:${pairs(id)}</div>
            <div>₹${pairs(id)*3}</div>

            <button onclick="addMember(${id},'left')">L</button>
            <button onclick="addMember(${id},'right')">R</button>

            <div class="children">
                ${m.left?make(m.left):""}
                ${m.right?make(m.right):""}
            </div>
        </div>
        `;
    }

    box.innerHTML = make(1);
}

// 👉 UPDATE
function update(){
    draw();

    document.getElementById("totalMembers").innerText = members.length;
    document.getElementById("totalPairs").innerText = totalPairs();
    document.getElementById("totalIncome").innerText = "₹"+totalIncome();
    document.getElementById("companyProfit").innerText = "₹"+profit();
}

// 👉 RUN AFTER LOAD
window.onload = function(){
    init();
    update();
}

</script>

</body>
</html>
