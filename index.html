<!DOCTYPE html>
<html>
<head>
  <title>MLM Panel</title>

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:#0b1b2b;
      color:white;
    }

    .sidebar {
      width:180px;
      height:100vh;
      background:#071423;
      float:left;
      padding:15px;
    }

    .sidebar button {
      width:100%;
      margin:5px 0;
      padding:8px;
    }

    .main {
      margin-left:200px;
      padding:15px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }

    th, td {
      border:1px solid #555;
      padding:6px;
      text-align:center;
    }

    input, select {
      padding:6px;
      margin:5px;
    }

    /* MOBILE FIX */
    @media(max-width:768px){
      .sidebar{
        width:100%;
        height:auto;
        float:none;
      }
      .main{
        margin-left:0;
      }
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>MLM Panel</h3>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('tree')">Tree</button>
  <button onclick="showPage('members')">Members</button>
</div>

<!-- MAIN -->
<div class="main">

  <h4>Select Company</h4>

  <select id="companySelect" onchange="changeCompany()">
    <option value="1">Company 1</option>
    <option value="2">Company 2</option>
    <option value="3">Company 3</option>
    <option value="4">Company 4</option>
    <option value="5">Company 5</option>
    <option value="6">Company 6</option>
    <option value="7">Company 7</option>
    <option value="8">Company 8</option>
    <option value="9">Company 9</option>
    <option value="10">Company 10</option>
  </select>

  <!-- COMPANY NAME -->
  <h2 id="companyTitle">Company 1</h2>

  <input id="companyNameInput" placeholder="Enter company name">
  <button onclick="renameCompany()">Rename</button>

  <hr>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <h3>Dashboard</h3>
    <p>Total Members: <span id="totalMembers">0</span></p>
    <p>Total Pairs: <span id="totalPairs">0</span></p>
    <p>Total Income: ₹<span id="totalCommission">0</span></p>
    <p>Company Profit: ₹<span id="companyProfit">0</span></p>
  </div>

  <!-- TREE -->
  <div id="tree" style="display:none;">
    <h3>Binary Tree</h3>

    <!-- ✅ FINAL FIX (NO CUT) -->
    <div style="
      width:100%;
      overflow-x:auto;
      overflow-y:hidden;
      border:1px solid #444;
      padding:10px;
    ">
      <div id="treeContainer" style="
        display:inline-block;
        min-width:1200px;
      "></div>
    </div>
  </div>

  <!-- MEMBERS -->
  <div id="members" style="display:none;">
    <h3>Members</h3>

    <input id="searchInput" placeholder="Search..." onkeyup="searchMember()">

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Left</th>
          <th>Right</th>
          <th>Pair</th>
          <th>Income</th>
          <th>Profit</th>
          <th>Edit</th>
        </tr>
      </thead>
      <tbody id="memberTable"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
