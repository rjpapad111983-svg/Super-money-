<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLM Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <div class="sidebar">
    <h2>MLM Panel</h2>

    <div class="btn" onclick="showPage('dashboard')">Dashboard</div>
    <div class="btn" onclick="showPage('tree')">Tree</div>
    <div class="btn" onclick="showPage('members')">Members</div>
    <div class="btn" onclick="addMember()">+ Add Member</div>

    <hr>
    <div class="btn">RJ Recharge</div>
    <div class="btn">Company 2</div>
    <div class="btn">Company 3</div>
    <div class="btn">Company 4</div>
    <div class="btn">Company 5</div>
    <div class="btn">Company 6</div>
    <div class="btn">Company 7</div>
    <div class="btn">Company 8</div>
    <div class="btn">Company 9</div>
    <div class="btn">Company 10</div>
  </div>

  <div class="main">

    <div id="dashboardPage">
      <h2>Dashboard</h2>
      <p>Total Members: <span id="totalMembers">0</span></p>
      <p>Total Pairs: <span id="totalPairs">0</span></p>
      <p>Total Income: ₹<span id="totalIncome">0</span></p>
      <p>Company Profit: ₹<span id="companyProfit">0</span></p>
    </div>

    <div id="treePage" style="display:none;">
      <h2>Binary Tree</h2>
      <div id="treeContainer" class="tree"></div>
    </div>

    <div id="membersPage" style="display:none;">
      <h2>Members</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th><th>ID</th><th>Left</th><th>Right</th>
            <th>Pairs</th><th>Income</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="memberTable"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- IMPORTANT -->
<script src="script.js" defer></script>
</body>
</html>
