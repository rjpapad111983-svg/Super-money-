<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLM Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1f2a;
  color: white;
}

/* sidebar */
.sidebar {
  width: 200px;
  height: 100vh;
  background: #061621;
  position: fixed;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  background: #ddd;
  border: none;
  cursor: pointer;
}

/* main */
.main {
  margin-left: 220px;
  padding: 20px;
}

/* table */
table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #555;
  padding: 8px;
  text-align: center;
}

/* tree container */
#treeContainer {
  width: 100%;
  height: 80vh;
  overflow: auto;
  border: 1px solid #444;
}

/* tree */
#tree {
  transform-origin: 0 0;
  transition: transform 0.2s;
  display: inline-block;
  padding: 40px;
}

/* node */
.node {
  border: 1px solid white;
  padding: 8px;
  border-radius: 8px;
  background: #0b1f2a;
  min-width: 110px;
}
</style>

</head>

<body>

<div class="sidebar">
  <h3>MLM Panel</h3>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('tree')">Tree</button>
  <button onclick="showPage('members')">Members</button>
</div>

<div class="main">

<!-- Dashboard -->
<div id="dashboardPage">
  <h2>Dashboard</h2>
  <p>Total Members: <span id="totalMembers"></span></p>
  <p>Total Pairs: <span id="totalPairs"></span></p>
  <p>Total Income: ₹<span id="totalIncome"></span></p>
  <p>Company Profit: ₹<span id="companyProfit"></span></p>
</div>

<!-- Tree -->
<div id="treePage" style="display:none;">
  <h2>Binary Tree</h2>

  <button onclick="zoomIn()">Zoom +</button>
  <button onclick="zoomOut()">Zoom -</button>

  <div id="treeContainer">
    <div id="tree"></div>
  </div>
</div>

<!-- Members -->
<div id="membersPage" style="display:none;">
  <h2>Members</h2>
  <input 
  type="text" 
  id="searchInput" 
  placeholder="Search name or ID..." 
  onkeyup="searchMember()" 
  style="padding:8px; width:250px; margin-bottom:10px; border-radius:6px;"
>
  <table id="membersTable"></table>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
